name: Android Release APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-release:
    name: Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Prepare Release Signing Keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            CI_PASS="forgeai_ci_release_key"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/ci-upload-key.jks" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 365 \
              -storepass "$CI_PASS" -keypass "$CI_PASS" \
              -dname "CN=ForgeAI CI, OU=Mobile, O=ForgeAI, L=Paris, ST=IDF, C=FR"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/ci-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: forgeai-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
